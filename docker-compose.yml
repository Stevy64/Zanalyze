# ════════════════════════════════════════════
# Zanalyze — production micro-services (OVH)
# Images : zanalyz-prod, zanalyz-moteur
# Services : nginx · web · moteur · worker · db · redis
# ════════════════════════════════════════════

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY obligatoire}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_SSL: ${DJANGO_SSL:-0}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
  DJANGO_DB_URL: postgres://${POSTGRES_USER:-zanalyz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zanalyz}
  GUNICORN_BIND: 0.0.0.0:8000
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  ZANALYZ_WHATSAPP_PHONE: ${ZANALYZ_WHATSAPP_PHONE:-}
  ZANALYZ_MOTEUR_URL: ${ZANALYZ_MOTEUR_URL:-http://moteur:8001}
  ENGINE_CALIBRATION_FILE: ${ENGINE_CALIBRATION_FILE:-/app/data/engine-calibration.json}
  ZANALYZ_REDIS_URL: ${ZANALYZ_REDIS_URL:-redis://redis:6379/0}

services:
  db:
    image: postgres:16-alpine
    container_name: zanalyz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zanalyz}
      POSTGRES_USER: ${POSTGRES_USER:-zanalyz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
    volumes:
      - zanalyz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zanalyz} -d ${POSTGRES_DB:-zanalyz}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - zanalyz-net

  redis:
    image: redis:7-alpine
    container_name: zanalyz-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - zanalyz-net

  moteur:
    build:
      context: .
      dockerfile: Dockerfile
      target: moteur
    image: zanalyz-moteur:latest
    container_name: zanalyz-moteur
    restart: unless-stopped
    environment:
      ZANALYZ_SKIP_MIGRATE: "1"
      ZANALYZ_SKIP_COLLECTSTATIC: "1"
      ENGINE_CALIBRATION_FILE: ${ENGINE_CALIBRATION_FILE:-/app/data/engine-calibration.json}
    volumes:
      - zanalyz_data:/app/data:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - zanalyz-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: zanalyz-prod:latest
    container_name: zanalyz-web
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - zanalyz_static:/app/staticfiles
      - zanalyz_data:/app/data
      - zanalyz_media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      moteur:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 50s
    networks:
      - zanalyz-net

  worker:
    image: zanalyz-prod:latest
    container_name: zanalyz-worker
    restart: unless-stopped
    environment:
      <<: *django-env
      ZANALYZ_SKIP_COLLECTSTATIC: "1"
      ZANALYZ_WORKER_INTERVAL: ${ZANALYZ_WORKER_INTERVAL:-7200}
      ZANALYZ_SYNC_LIVE: ${ZANALYZ_SYNC_LIVE:-1}
      ZANALYZ_SNAPSHOT_URL: ${ZANALYZ_SNAPSHOT_URL:-}
      ZANALYZ_SYNC_PAGES: ${ZANALYZ_SYNC_PAGES:-1}
      ZANALYZ_SYNC_PASSES: ${ZANALYZ_SYNC_PASSES:-1}
      ZANALYZ_SYNC_CONTEXTE: ${ZANALYZ_SYNC_CONTEXTE:-0}
      ZANALYZ_REDIS_URL: ${ZANALYZ_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - zanalyz_data:/app/data
      - zanalyz_media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      moteur:
        condition: service_healthy
      web:
        condition: service_started
    entrypoint: ["sh", "/app/deploy/docker-entrypoint.sh"]
    command: ["sh", "/app/deploy/worker-loop.sh"]
    networks:
      - zanalyz-net

  nginx:
    image: nginx:1.27-alpine
    container_name: zanalyz-nginx
    restart: unless-stopped
    ports:
      - "${ZANALYZ_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - zanalyz_static:/var/www/static:ro
      - zanalyz_media:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - zanalyz-net

volumes:
  zanalyz_pg_data:
  zanalyz_static:
  zanalyz_data:
  zanalyz_media:

networks:
  zanalyz-net:
    driver: bridge
    name: zanalyz-net
