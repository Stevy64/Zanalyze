apiVersion: batch/v1
kind: Job
metadata:
  name: zanalyze-migrate
  namespace: zanalyze
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/stevy64/zanalyze:main
          imagePullPolicy: Always
          workingDir: /app
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: zanalyze
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
