apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zanalyze-data
  namespace: zanalyze
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zanalyze-media
  namespace: zanalyze
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
